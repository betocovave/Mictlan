<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mictlán</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0a0f;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  #ui button[aria-pressed=true]{background:#6e2a1f;border-color:#c9b48a}
  #dlg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(720px,calc(100vw - 32px));box-sizing:border-box;background:#0f0e14ee;border:4px double #c9b48a;border-radius:4px;padding:22px 18px 10px;font:22px/1.25 'VT323',monospace;color:#e8e0cc;box-shadow:0 0 0 2px #0f0e14}
  #who{position:absolute;top:-16px;left:14px;background:#6e2a1f;border:2px solid #c9b48a;padding:0 10px;font-size:20px;color:#f2e6c8}
  #say{margin:0;min-height:5em}
  #face{float:left;width:120px;height:120px;margin:0 16px 4px 0;image-rendering:pixelated;border:3px solid #c9b48a;outline:2px solid #0f0e14;background:#1c1b26}
  @media (max-width:520px){#face{width:76px;height:76px;margin-right:10px}#dlg{font-size:19px}}
  #nav{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:18px;color:#a89f8a}
  #nav button{font:inherit;color:#e8e0cc;background:none;border:1px solid #4a4558;border-radius:4px;padding:2px 10px;cursor:pointer}
  #dlg.done #next{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{color:#c9b48a;border-color:#c9b48a}}
  @media (prefers-reduced-motion:reduce){#dlg.done #next{animation:none}}
  #ui{position:fixed;right:16px;top:16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:13px system-ui,sans-serif;color:#cfc6b2}
  #ui button{font:inherit;color:inherit;background:#1c1b26cc;border:1px solid #4a4558;border-radius:6px;padding:8px 12px;cursor:pointer}
  #ui button:focus-visible{outline:2px solid #9fe3ff}
  #ui{z-index:1}
  #codex{position:fixed;inset:0;display:grid;place-items:center;padding:72px 16px 16px;box-sizing:border-box;background:#0b0a0fcc}
  #codex[hidden]{display:none}
  #leaf{display:grid;justify-items:center;text-align:center;width:min(900px,100%);max-height:100%;box-sizing:border-box;padding:0 22px 12px;background:#d9c79a repeating-linear-gradient(0deg,#0000 0 5px,#8a6a3e18 5px 6px);border:6px solid #6e2a1f;outline:2px solid #1a1210;font:22px/1.25 'VT323',monospace;color:#2a1e18;box-shadow:0 0 40px #000}
  .greca{justify-self:stretch;height:14px;margin:0 -22px;background:repeating-linear-gradient(90deg,#1a1210 0 4px,#d9c79a 4px 8px,#6e2a1f 8px 16px,#d9c79a 16px 20px)}
  .greca:first-child{margin-bottom:14px}.greca:last-of-type{margin-top:10px}
  #cart{width:min(100%,576px,max(240px,calc((100vh - 330px) * 1.5)));height:auto;align-self:start;image-rendering:pixelated;outline:3px solid #6e2a1f;outline-offset:3px;margin:6px 0 14px}
  #cwho{margin:0 0 6px;font-size:34px;font-weight:normal;color:#6e2a1f}
  #ctext{margin:0;max-width:34em}
  #cnav{justify-self:stretch;display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:18px;color:#6e2a1f}
  #cnav button{font:inherit;color:#2a1e18;background:none;border:2px solid #6e2a1f;border-radius:4px;padding:2px 10px;cursor:pointer}
  #cnav button:focus-visible{outline:2px solid #1a1210}
  @media (max-width:620px){#leaf{font-size:19px;padding:0 12px 10px}.greca{margin:0 -12px}#cwho{font-size:26px}}
  #sub{position:fixed;left:16px;top:16px;max-width:min(420px,calc(100vw - 200px));background:#0f0e14dd;border:2px solid #c9b48a;padding:4px 10px;font:20px/1.2 'VT323',monospace;color:#e8e0cc}
  #hint{background:#1c1b26aa;padding:6px 10px;border-radius:6px;display:none}
</style>
</head>
<body>
<div id="codex" hidden>
  <div id="leaf" role="region" aria-label="Códice">
    <div class="greca"></div>
    <h2 id="cwho"></h2>
    <canvas id="cart" width="96" height="64" role="img"></canvas>
    <p id="ctext" aria-live="polite"></p>
    <div class="greca"></div>
    <div id="cnav"><button id="cprev" aria-label="Lámina anterior">◀</button><span id="ccnt"></span><button id="cnext" aria-label="Lámina siguiente">▶</button></div>
  </div>
</div>
<div id="ui">
  <div role="group" aria-label="Modo de vista"><button data-m="orbit">Orbital</button> <button data-m="pov">POV</button> <button data-m="guide">Guía</button> <button data-m="codice">Códice</button></div>
  <button id="music" aria-pressed="true">♪ Música</button>
  <div id="hint">WASD / flechas: caminar · arrastrar: mirar · rueda o pellizco: avanzar · Shift: correr</div>
</div>
<div id="sub" hidden></div>
<div id="dlg" hidden>
  <canvas id="face" width="48" height="48" aria-hidden="true"></canvas>
  <div id="who"></div>
  <p id="say" aria-live="polite"></p>
  <div id="nav"><button id="prev" aria-label="Anterior">◀</button><span id="cnt"></span><button id="next" aria-label="Siguiente">▶</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const LOOP = 20;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const SKY = 0x1c1b26;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.FogExp2(SKY, 0.005);
const camera = new THREE.PerspectiveCamera(50, 9 / 16, 0.5, 700);
// Full screen; screens narrower than 9:16 widen the fov so the island keeps its 9:16 framing.
const HFOV916 = 2 * Math.atan(Math.tan(25 * Math.PI / 180) * 9 / 16);
function fit() {
  const a = innerWidth / innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = a;
  camera.fov = a < 9 / 16 ? 2 * Math.atan(Math.tan(HFOV916 / 2) / a) * 180 / Math.PI : 50;
  camera.updateProjectionMatrix();
}
fit();
addEventListener('resize', fit);

// ---------- helpers ----------
let seed = 7;
const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rnd() * a.length)];
const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
const lerp = (a, b, t) => a + (b - a) * t;
const noise = (x, z) => {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return lerp(lerp(hash(xi, zi), hash(xi + 1, zi), u), lerp(hash(xi, zi + 1), hash(xi + 1, zi + 1), u), v);
};
const ss = (a, b, t) => { t = Math.min(1, Math.max(0, (t - a) / (b - a))); return t * t * (3 - 2 * t); };

const box = new THREE.BoxGeometry(1, 1, 1);
const stone = new THREE.MeshStandardMaterial({ roughness: 0.92 });
const glowMat = new THREE.MeshBasicMaterial();
const wet = new THREE.MeshStandardMaterial({ roughness: 0.12, metalness: 0.7 });
const tmpC = new THREE.Color();

// Voxel set -> instanced meshes; fully enclosed voxels are culled.
class V {
  constructor(s = 1, mat = stone) { this.s = s; this.mat = mat; this.m = new Map(); }
  put(x, y, z, c, e = false) { this.m.set(x + ',' + y + ',' + z, [x, y, z, c, e]); }
  fill(x0, y0, z0, x1, y1, z1, c, e) {
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++)
      { const col = typeof c == 'function' ? c(x, y, z) : c; if (col != null) this.put(x, y, z, col, e); }
  }
  has(x, y, z) { return this.m.has(x + ',' + y + ',' + z); }
  build() {
    const g = new THREE.Group(), s = this.s, o = new THREE.Object3D(), sets = [[], []];
    for (const v of this.m.values()) {
      const [x, y, z] = v;
      if (this.has(x + 1, y, z) && this.has(x - 1, y, z) && this.has(x, y + 1, z) && this.has(x, y - 1, z) && this.has(x, y, z + 1) && this.has(x, y, z - 1)) continue;
      sets[v[4] ? 1 : 0].push(v);
    }
    sets.forEach((arr, k) => {
      if (!arr.length) return;
      const im = new THREE.InstancedMesh(box, k ? glowMat : this.mat, arr.length);
      arr.forEach((v, i) => {
        o.position.set(v[0] * s, v[1] * s, v[2] * s); o.scale.setScalar(s); o.updateMatrix();
        im.setMatrixAt(i, o.matrix);
        tmpC.set(v[3]); if (!k) tmpC.offsetHSL(0, 0, (rnd() - 0.5) * 0.04);
        im.setColorAt(i, tmpC);
      });
      im.castShadow = im.receiveShadow = !k;
      g.add(im);
    });
    return g;
  }
}

const world = new THREE.Group();
scene.add(world);
const place = (v, x, y, z, parent = world) => { const g = v.build(); g.position.set(x, y, z); parent.add(g); return g; };

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x5b6f99, 0x2b2220, 1.1));
const sun = new THREE.DirectionalLight(0x8fa6d6, 1.7);
sun.position.set(-40, 70, 35);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -85, right: 85, top: 85, bottom: -85, near: 1, far: 260 });
sun.shadow.bias = -0.0008;
scene.add(sun);
const ember = (x, y, z, i = 40) => { const l = new THREE.PointLight(0xff7a2a, i, 22, 2); l.position.set(x, y, z); world.add(l); return l; };

// ---------- floating island ----------
const R = 32;
const top = {};
const rx = z => 22 + Math.sin(z * 0.15) * 2.5;
const inPlaza = (x, z) => Math.abs(x) < 17 && z > -26 && z < 15;
const isl = new V(1), water = new V(1, wet);
for (let x = -40; x <= 40; x++) for (let z = -40; z <= 40; z++) {
  const d = Math.hypot(x, z * 1.08) / R + (noise(x * 0.12 + 9, z * 0.12) - 0.5) * 0.3;
  if (d > 1) continue;
  const river = Math.abs(x - rx(z)) < 1.7 && z > -20;
  let h = inPlaza(x, z) ? 3 : 3 + Math.floor(noise(x * 0.09, z * 0.09 + 4) * 5 * Math.max(0, d - 0.3));
  if (river) h = 1;
  const b = 2 - Math.floor(Math.pow(1 - d, 0.55) * 30 + noise(x * 0.3, z * 0.3) * 6);
  top[x + ',' + z] = river ? 2 : h;
  for (let y = b; y <= h; y++) {
    let c;
    if (y == h && !river) c = inPlaza(x, z)
      ? ((x % 4 == 0 || z % 4 == 0) ? '#bdb5a3' : pick(['#4a4544', '#524b47', '#463f3f']))
      : pick(['#7d6038', '#6b4d30', '#5f6450', '#585450', '#8a6a3e', '#6e5236']);
    else if (y > h - 2) c = pick(['#5c4630', '#4f3d2c']);
    else if ((y + 60) % 7 == 0) c = pick(['#c4bba6', '#b3ab98']);
    else c = pick(['#2b292e', '#35302f', '#24232a', '#3a3436']);
    isl.put(x, y, z, c);
  }
  if (river) water.put(x, 2, z, '#0b0c12');
  if (!inPlaza(x, z) && !river && d > 0.55 && hash(x, z) > 0.965) {
    const hh = 2 + Math.floor(hash(z, x) * 4);
    for (let y = 1; y <= hh; y++) isl.put(x, h + y, z, '#121118');
  }
}
const ground = (x, z) => (top[Math.round(x) + ',' + Math.round(z)] ?? 3) + 0.5;

// bone-white pathways
const path = (x0, x1, z0, z1) => { for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) { const k = x + ',' + z; if (top[k] > 2) isl.put(x, top[k], z, pick(['#c9c1ae', '#bab29f'])); } };
path(-27, -17, 0, 1); path(17, 20, 1, 3); path(24, 28, 1, 3); path(-1, 1, 15, 22);
// low stone bridge over the river
for (let x = Math.round(rx(2)) - 3; x <= Math.round(rx(2)) + 3; x++) for (let z = 1; z <= 3; z++) {
  const y = Math.abs(x - rx(2)) < 2 ? 4 : 3;
  isl.put(x, y, z, '#46403e');
  if (z != 2) isl.put(x, y + 1, z, '#2f2b2c');
}
place(isl, 0, 0, 0);
place(water, 0, 0, 0);

// where the river leaves the island
let ez = -20;
for (let z = -20; z < 45; z++) if (top[Math.round(rx(z)) + ',' + z] !== undefined) ez = z;
const fallO = new THREE.Vector3(rx(ez), 2.4, ez + 0.6), fallDir = new THREE.Vector3(fallO.x, 0, fallO.z).normalize();

// ---------- temple (teocalli) ----------
const T = new V(0.5);
const basalt = () => pick(['#2a272b', '#312d31', '#2d2a2c']);
const ws = [26, 21, 17, 13, 10], TH = 6;
for (let i = 0; i < ws.length; i++) {
  const y0 = i * TH;
  for (let y = y0; y < y0 + TH; y++) {
    const w = ws[i] - Math.floor((y - y0) / 3); // talud slope
    for (let x = -w; x <= w; x++) for (let z = -w; z <= w; z++) {
      const edge = Math.max(Math.abs(x), Math.abs(z));
      if (edge != w && y != y0 + TH - 1) continue;
      const u = Math.abs(z) == w ? x : z, m = ((u % 8) + 8) % 8, r = y - y0;
      let c = basalt();
      if (y == y0 + TH - 1) c = '#3e3a3c';
      else if (r == 3) c = m == 2 || m == 4 ? '#0d0c10' : m == 3 ? '#c9c0ab' : m == 0 || m == 6 ? '#121016' : c;
      else if (r == 2) c = m >= 2 && m <= 4 ? '#c9c0ab' : c;
      else if (r == 1 || r == 4) c = ((u + (r == 1 ? 0 : 4)) % 8 + 8) % 8 < 3 ? '#5f5e4a' : c; // serpent bands
      T.put(x, y, z, c);
    }
  }
}
// stairway + alfardas with serpent heads
for (let y = 0; y < 30; y++) {
  const zEnd = 39 - y;
  for (let z = Math.max(0, zEnd - 10); z <= zEnd; z++) {
    for (let x = -4; x <= 4; x++) T.put(x, y, z, z == zEnd ? (y % 2 ? '#57504d' : '#4a4446') : basalt());
    for (const sx of [-6, -5, 5, 6]) T.put(sx, y + 1, z, '#2a272b');
  }
}
for (const sx of [-1, 1]) {
  T.fill(sx * 7 - 1, 0, 39, sx * 7 + 1, 3, 42, '#5b5a48');
  T.put(sx * 7, 2, 43, '#0d0c10'); T.put(sx * 7 - sx, 3, 42, '#0d0c10');
}
// braziers on tier corners
for (let i = 0; i < ws.length; i++) {
  const y = (i + 1) * TH, w = ws[i] - 3;
  for (const sx of [-1, 1]) {
    T.fill(sx * w - 1, y, w - 1, sx * w + 1, y, w + 1, '#3a2a22');
    T.fill(sx * w, y + 1, w, sx * w, y + 2, w, '#ff8a3a', true);
  }
}
// summit shrine and obelisk
for (let y = 30; y < 38; y++) for (let x = -6; x <= 6; x++) for (let z = -6; z <= 6; z++)
  if (Math.max(Math.abs(x), Math.abs(z)) == 6 || y == 37) T.put(x, y, z, y == 37 ? '#3e3a3c' : basalt());
T.fill(-1, 30, 6, 1, 33, 6, '#0a090c');
T.fill(-1, 38, -1, 0, 56, 0, (x, y) => y % 6 == 0 ? '#bdb5a3' : '#1d1b20');
T.fill(-1, 57, -1, 0, 58, 0, '#9fe3ff', true);
const temple = place(T, 0, 3.75, -11);
const tip = new THREE.PointLight(0x8fd8ff, 60, 40, 2);
tip.position.set(0, 3.75 + 29, -11);
world.add(tip);
ember(-11.5, 3.75 + 3.5, -11 + 11.5); ember(11.5, 3.75 + 3.5, -11 + 11.5);
ember(-7, 3.75 + 9.5, -11 + 7); ember(7, 3.75 + 9.5, -11 + 7);

// ---------- small props (0.2 voxels) ----------
const P = new V(0.2);
const at = (px, pz) => [Math.round(px * 5), Math.round(ground(px, pz) * 5 + 0.5), Math.round(pz * 5)];
const skull = (px, pz) => { const [x, y, z] = at(px, pz); P.fill(x - 2, y, z - 2, x + 2, y + 3, z + 2, '#d8d0bd'); P.fill(x - 1, y, z + 3, x + 1, y + 1, z + 3, '#cfc6b2'); P.put(x - 1, y + 2, z + 3, '#141214'); P.put(x + 1, y + 2, z + 3, '#141214'); };
const bone = (px, pz) => { const [x, y, z] = at(px, pz); for (let k = -3; k <= 3; k++) P.put(x + k, y, z, '#d2cab6'); P.put(x - 3, y, z + 1, '#d2cab6'); P.put(x + 3, y, z - 1, '#d2cab6'); };
const bowl = (px, pz) => { const [x, y, z] = at(px, pz); P.fill(x - 2, y, z - 2, x + 2, y + 1, z + 2, '#7a4f33'); P.fill(x - 1, y + 1, z - 1, x + 1, y + 1, z + 1, '#3b2216'); };
const vessel = (px, pz) => { const [x, y, z] = at(px, pz); P.fill(x - 1, y, z - 1, x + 1, y + 4, z + 1, '#8a5a3a'); P.put(x + 1, y + 2, z + 1, '#1a1210'); P.put(x - 1, y + 4, z, '#1a1210'); P.put(x, y + 5, z, '#8a5a3a'); };
const figurine = (px, pz) => { const [x, y, z] = at(px, pz); P.fill(x - 1, y + 2, z - 2, x + 1, y + 3, z + 2, '#9a6440'); for (const [a, b] of [[-1, -2], [1, -2], [-1, 2], [1, 2]]) P.fill(x + a, y, z + b, x + a, y + 1, z + b, '#9a6440'); P.fill(x, y + 4, z + 2, x, y + 5, z + 3, '#9a6440'); P.put(x - 1, y + 6, z + 2, '#9a6440'); P.put(x + 1, y + 6, z + 2, '#9a6440'); };
const lantern = (px, pz, light) => { const [x, y, z] = at(px, pz); P.fill(x - 1, y, z - 1, x + 1, y + 4, z + 1, '#6e4630'); P.fill(x, y + 1, z - 1, x, y + 3, z + 1, '#ffa04a', true); P.fill(x - 1, y + 1, z, x + 1, y + 3, z, '#ffa04a', true); if (light) ember(px, ground(px, pz) + 0.6, pz, 12); };
seed = 21;
for (let i = 0; i < 40; i++) {
  const a = rnd() * Math.PI * 2, r = 10 + rnd() * 22, x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (Math.abs(x) < 14 && z > -25 && z < 9.5) continue; // temple footprint
  if (Math.abs(x - rx(z)) < 2.5 || Math.hypot(x, z * 1.08) > 28) continue;
  [skull, bone, skull, vessel][i % 4](x, z);
}
for (const [x, z] of [[-10, 14.2], [-3, 13.5], [3, 13.5], [10, 14.2], [14, 10], [-14, 10]]) bowl(x, z);
for (const [x, z] of [[-8, 11], [8, 11], [-15, 4], [15, 4], [4, 12]]) figurine(x, z);
lantern(-21, 2.5, true); lantern(18.5, 4, true); lantern(25.5, 4, false); lantern(-22, -9.5, false); lantern(1.8, 17, false);
place(P, 0, 0, 0);

// ---------- houses, loom, trees ----------
function house(px, pz, ry) {
  const v = new V(0.5), w = 5, d = 4, h = 6;
  for (let x = -w; x <= w; x++) for (let y = 0; y <= h; y++) for (let z = -d; z <= d; z++)
    if (Math.abs(x) == w || Math.abs(z) == d) v.put(x, y, z, pick(['#7a5236', '#6d4a31', '#835a3b']));
  v.fill(-w - 1, h + 1, -d - 1, w + 1, h + 1, d + 1, '#4d3a2b');
  v.fill(-1, 0, d, 1, 3, d, '#151214');
  v.put(3, 3, d, '#2a1e18');
  const g = place(v, px, ground(px, pz) + 0.25, pz); g.rotation.y = ry;
}
house(-25, 4, Math.PI / 2); house(-24, -13, Math.PI / 2.4); house(28, -1, -Math.PI / 2);
{ // wooden loom beside the eastern hut
  const v = new V(0.25);
  v.fill(-5, 0, 0, -5, 11, 0, '#4a3324'); v.fill(5, 0, 0, 5, 11, 0, '#4a3324');
  v.fill(-5, 11, 0, 5, 11, 0, '#3c2a1e'); v.fill(-5, 2, 0, 5, 2, 0, '#3c2a1e');
  for (let x = -4; x <= 4; x++) for (let y = 3; y <= 10; y++) if (y < 7 || x % 2 == 0) v.put(x, y, 0, y < 7 ? (((x + y) % 3) ? '#a5793c' : '#7e2f22') : '#c9b48a');
  const g = place(v, 26.5, ground(26.5, 5) + 0.125, 5); g.rotation.y = -0.4;
}
const sway = [];
seed = 99;
function tree(px, pz) {

  if (o.feather) { hv.fill(0, 5, -2, 0, 9, -2, '#3d6b5a'); hv.fill(-1, 5, -2, -1, 7, -2, '#a8742e'); hv.fill(1, 5, -2, 1, 7, -2, '#a8742e'); }
  place(hv, 0, 0, 0, head);
  const k = { root, pel, torso, head, la, ra, ll, rl };
  if (o.act) skels.push({ k, act: o.act });
  return k;
}
const hold = (part, v, x = 0, y = 0, z = 0) => place(v, x, y, z, part);
const sitP = k => { k.pel.position.y = S2; k.ll.rotation.x = k.rl.rotation.x = -1.5; };
const walkP = (k, e, f = 6, amp = 0.5) => {
  const w = Math.sin(e * f);
  k.ll.rotation.x = w * amp; k.rl.rotation.x = -w * amp; k.la.rotation.x = -w * amp * 0.8; k.ra.rotation.x = w * amp * 0.8;
  k.pel.position.y = 6 * S2 + Math.abs(Math.cos(e * f)) * 0.06;
};
const pathP = (k, a, b, period, e) => { // ping-pong walk between a and b
  const u = (e / period) % 2, f = u < 1 ? u : 2 - u, x = lerp(a.x, b.x, f), z = lerp(a.z, b.z, f);
  k.root.position.set(x, ground(x, z), z);
  k.root.rotation.y = face(a.x, a.z, b.x, b.z) + (u < 1 ? 0 : Math.PI);
  return f;
};
function fire(x, z, parent) {
  const v = new V(S2);
  v.fill(-2, 0, 0, 2, 0, 0, '#3a2a1e'); v.fill(0, 0, -2, 0, 0, 2, '#3a2a1e');
  v.fill(-1, 1, -1, 1, 1, 1, '#ff8a3a', true); v.fill(0, 2, 0, 0, 3, 0, '#ffc06a', true);
  if (parent) place(v, 0, 0, 0, parent); else place(v, x, ground(x, z) + S2 / 2, z);
  fires.push(ember(x, ground(x, z) + 1, z, 25));
}
const vox = (fn, s = S2) => { const v = new V(s); fn(v); return v; };
const CLOTH = ['#5a1f1a', '#a8742e', '#2b2628', '#c9b48a', '#6e2a1f'];

// -- taller (workshop): potter, weaver, cook, sweeper
{

  const weaver = skeleton(cx, cz + 7, 0, { cloth: CLOTH[3], band: '#6e2a1f', act: (k, e) => { sitP(k); k.torso.rotation.x = 0.15 + Math.sin(e * 1.5) * 0.05; k.la.rotation.x = k.ra.rotation.x = -1.2; k.la.rotation.z = Math.sin(e * 1.5) * 0.3; k.ra.rotation.z = Math.sin(e * 1.5) * 0.3; } });
  hold(weaver.root, vox(v => { v.fill(0, 0, 11, 0, 7, 11, '#3a2a1e'); for (let z = 2; z <= 10; z++) v.fill(-2, 4, z, 2, 4, z, (x) => ((x + z) % 3 ? '#a5793c' : '#7e2f22')); }));
  const cook = skeleton(cx + 1, cz - 4, -Math.PI / 2, { cloth: CLOTH[4], act: (k, e) => { k.torso.rotation.x = 0.3; k.ra.rotation.x = -1.1 + Math.sin(e * 3) * 0.2; k.ra.rotation.z = Math.cos(e * 3) * 0.2; k.la.rotation.x = -0.3; } });
  const pot = atRoot(cx - 0.4, cz - 4, 0);

// -- pelota (ball game)
const ballGame = { players: [] };
{
  const [cx, cz] = ISL.pelota;
  ballGame.a = new THREE.Vector3(cx - 3.2, 0, cz); ballGame.b = new THREE.Vector3(cx + 3.2, 0, cz);
  for (const [px, ry, side] of [[cx - 4, Math.PI / 2, 0], [cx + 4, -Math.PI / 2, 1]])
    ballGame.players.push({ side, k: skeleton(px, cz, ry, { cloth: side ? CLOTH[0] : CLOTH[1], band: side ? '#5a1f1a' : '#a8742e' }) });
  ballGame.ball = place(vox(v => v.fill(-1, -1, -1, 1, 1, 1, '#1a1714')), cx, 5, cz);
  for (const wz of [cz - 3.6, cz + 3.6]) { const r = place(vox(v => { for (let a = 0; a < 6.28; a += 0.2) v.put(Math.round(Math.cos(a) * 3), Math.round(Math.sin(a) * 3), 0, '#4a4544'); }, 0.25), cx, 5.6, wz); }
  for (const sx of [-2, 2]) skeleton(cx + sx, cz - 4, 0, { cloth: pick(CLOTH), act: (k, e) => { sitP(k); k.la.rotation.x = k.ra.rotation.x = -1.3; const c = 0.15 + 0.15 * Math.abs(Math.sin(e * 7 + sx)); k.la.rotation.z = -c; k.ra.rotation.z = c; } });
  skeleton(cx + 10, cz + 2, -Math.PI / 2, { band: '#2b2628', act: (k, e) => { k.head.rotation.y = Math.sin(e * 1.95) * 0.6; k.la.rotation.x = -0.4; } }); // referee follows the ball
}

// -- musica (music and dance)
{
  const [cx, cz] = ISL.musica;
  fire(cx, cz);
  for (let i = 0; i < 5; i++) skeleton(cx, cz, 0, { cloth: CLOTH[i % 5], feather: true, act: (k, e) => {
    const a = i / 5 * Math.PI * 2 + e * 0.45, x = cx + Math.cos(a) * 3.6, z = cz + Math.sin(a) * 3.6;

  } });

  hold(drummer.root, vox(v => { for (let y = 0; y <= 7; y++) for (let x = -2; x <= 2; x++) for (let z = -2; z <= 2; z++) if (x * x + z * z <= 5) v.put(x, y, z, y == 7 ? '#c9b48a' : y == 2 || y == 3 ? '#3a2a1e' : '#6b4423'); }), 0, S2 / 2, 1.5);
  const tepo = skeleton(cx + 5, cz - 6, face(cx + 5, cz - 6, cx, cz), { cloth: CLOTH[3], act: (k, e) => { sitP(k); k.la.rotation.x = -1.1 + Math.max(0, Math.sin(e * 6)) * 0.4; k.ra.rotation.x = -1.1 + Math.max(0, Math.cos(e * 6)) * 0.4; } });
  hold(tepo.root, vox(v => { v.fill(-4, 0, -1, 4, 2, 1, '#6b4423'); v.fill(-2, 2, 0, 2, 2, 0, '#1a1210'); }), 0, S2 / 2, 1.4);
  const flute = skeleton(cx + 6, cz + 3, face(cx + 6, cz + 3, cx, cz), { cloth: CLOTH[4], act: (k, e) => { k.la.rotation.x = k.ra.rotation.x = -1.4; k.la.rotation.z = -0.5; k.ra.rotation.z = 0.5; k.head.rotation.x = 0.1 + Math.sin(e * 3) * 0.08; k.torso.rotation.z = Math.sin(e * 1.5) * 0.08; } });
  hold(flute.head, vox(v => v.fill(0, 0, 0, 0, 0, 5, '#9a6440')), 0, 1.5 * S2, 2.5 * S2).rotation.x = 0.5;
}

// -- flor (cempasúchitl field, petal bridge, offering carrier with a xolo pup, fisher)
const pup = { g: null };
{
  const [cx, cz] = ISL.flor, br = bridges.flor;
  const F = new V(S2);
  for (let i = 0; i < 140; i++) {
    const a = rnd() * Math.PI * 2, r = 2 + rnd() * 6.5, fx = cx + 2 + Math.cos(a) * r, fz = cz - 1 + Math.sin(a) * r;
    if (top[key(fx, fz)] === undefined) continue;
    const [x, y, z] = at(fx, fz), h = 2 + Math.floor(rnd() * 2);
    F.fill(x, y, z, x, y + h, z, '#4f6b3a');
    F.fill(x - 1, y + h + 1, z - 1, x + 1, y + h + 1, z + 1, () => pick(['#e8891e', '#f2a33a', '#d9771a']));
    F.put(x, y + h + 2, z, '#c45f12');
  }
  for (let f = 0; f <= 1; f += 0.01) { // petal path along the bridge
    const px = lerp(br.a.x, br.b.x, f) + (rnd() - 0.5) * 2.2, pz = lerp(br.a.z, br.b.z, f) + (rnd() - 0.5) * 2.2, [x, y, z] = at(px, pz);
    F.put(x, y, z, pick(['#e8891e', '#f2a33a']));
  }
  place(F, 0, 0, 0);
  for (const [gx, gz, ph] of [[cx - 1, cz + 2, 0], [cx + 4, cz - 4, 2]]) skeleton(gx, gz, ph, { cloth: CLOTH[3], act: (k, e) => { const b = 0.5 + 0.5 * Math.sin(e * 1.2 + ph); k.torso.rotation.x = 0.4 + b * 0.6; k.la.rotation.x = k.ra.rotation.x = -0.3 - b * 0.5; k.head.rotation.x = 0.2; } });
  const carrier = skeleton(br.a.x, br.a.z, 0, { cloth: CLOTH[0], act: (k, e) => {
    const f = pathP(k, br.a, br.b, 14, e); walkP(k, e, 5, 0.45); k.la.rotation.x = k.ra.rotation.x = 0; k.la.rotation.z = 2.8; k.ra.rotation.z = -2.8;
    const pf = Math.min(1, Math.max(0, f + ((e / 14) % 2 < 1 ? -0.05 : 0.05))), x = lerp(br.a.x, br.b.x, pf), z = lerp(br.a.z, br.b.z, pf);
    pup.g.position.set(x, ground(x, z) + 0.7 + Math.abs(Math.sin(e * 9)) * 0.08, z); pup.g.rotation.y = k.root.rotation.y;
  } });
  hold(carrier.head, vox(v => { v.fill(-2, 0, -2, 2, 2, 2, '#8a6a3e'); v.fill(-1, 3, -1, 1, 3, 1, () => pick(['#e8891e', '#f2a33a'])); }), 0, 5 * S2, 0);
  pup.g = place(vox(v => {
    v.fill(-1, 0, -3, 1, 2, 3, () => pick(skin)); for (const [a, b] of [[-1, -2], [1, -2], [-1, 2], [1, 2]]) v.fill(a, -3, b, a, -1, b, () => pick(skin));
    v.fill(-1, 2, 3, 1, 4, 6, () => pick(skin)); v.fill(-1, 5, 4, -1, 6, 4, '#3d3836'); v.fill(1, 5, 4, 1, 6, 4, '#3d3836');
    v.put(-1, 3, 6, '#ffb347', true); v.put(1, 3, 6, '#ffb347', true); v.fill(0, 2, -5, 0, 3, -4, () => pick(skin));
  }), 0, 0, 0);
  const ux = (cx) / Math.hypot(cx, cz), uz = cz / Math.hypot(cx, cz), fx = cx + ux * 8, fz = cz + uz * 8;
  const fisher = skeleton(fx, fz, Math.atan2(ux, uz), { cloth: CLOTH[2], band: '#c9b48a', act: (k, e) => { sitP(k); k.ra.rotation.x = -1.2 + Math.sin(e * 0.8) * 0.05; k.la.rotation.x = -0.8; k.head.rotation.x = 0.25; } });
  const rod = hold(fisher.ra, vox(v => v.fill(0, 0, 0, 0, 0, 16, '#4a3324')), 0, -6 * S2, 0);
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.03, 9, 0.03).translate(0, -4.5, 0), new THREE.MeshBasicMaterial({ color: 0x9a948a }));
  line.position.set(0, 0, 16 * S2); line.rotation.x = 1.2; rod.add(line);
}
// -- mercado (tianguis): sellers on petates, strolling buyers, a tameme with a tumpline
{
  const [cx, cz] = ISL.mercado, br = bridges.mercado;
  [['#e8c04a', '#c9a032'], ['#a8321f', '#7e2f22'], ['#5a3a22', '#4a3324'], ['#3d8f87', '#2f6f69']].forEach(([a, b], i) => { // maíz, chile, cacao, jade
    const gx = cx - 6 + i * 4, gz = cz - 2;
    hold(atRoot(gx, gz, 0), vox(v => { v.fill(-5, 0, -4, 5, 0, 4, (x, y, z) => (x + z) % 2 ? '#a5793c' : '#8a6a3e'); for (const [px, pz] of [[-2, -1], [2, 1]]) v.fill(px - 1, 1, pz - 1, px + 1, 2, pz + 1, (x, y) => y == 2 ? a : b); }), 0, S2 / 2, 0);
    skeleton(gx, gz - 1.3, 0, { cloth: CLOTH[i], act: (k, e) => { sitP(k); k.ra.rotation.x = -0.6 + Math.sin(e * 2 + i) * 0.3; k.head.rotation.y = Math.sin(e * 0.7 + i) * 0.5; } });
  });
  for (const [ph, cl] of [[0, 3], [8, 4]]) skeleton(cx, cz + 3, 0, { cloth: CLOTH[cl], act: (k, e) => { pathP(k, { x: cx - 6, z: cz + 3 }, { x: cx + 6, z: cz + 3 }, 16, e + ph); walkP(k, e, 5, 0.45); } });
  const porter = skeleton(br.a.x, br.a.z, 0, { cloth: CLOTH[1], act: (k, e) => { pathP(k, br.a, br.b, 18, e); walkP(k, e, 4, 0.35); k.torso.rotation.x = 0.35; k.la.rotation.x = k.ra.rotation.x = -2.6; } });
  hold(porter.torso, vox(v => { v.fill(-2, 2, -4, 2, 7, -2, '#a8742e'); v.fill(-2, 8, -2, 2, 8, 0, '#4a3324'); }));

// -- milpa: maize, beans and squash, a farmer with a coa, a woman at the metate
{
  const [cx, cz] = ISL.milpa, F = new V(S2);

    const [vx, vy, vz] = at(x, z), h = 7 + Math.floor(rnd() * 4);
    F.fill(vx, vy, vz, vx, vy + h, vz, '#5f7f3a');
    F.put(vx + 1, vy + h - 3, vz, '#e8c04a'); F.put(vx + 1, vy + h - 4, vz, '#e8c04a'); // elote
    F.put(vx - 1, vy + h - 2, vz, '#4f6b3a'); F.put(vx, vy + h - 5, vz + 1, '#4f6b3a');
    F.put(vx, vy + h + 1, vz, '#c9a032');
    if (rnd() < 0.4) F.fill(vx + 1, vy, vz + 1, vx + 2, vy + 1, vz + 2, '#c98a2a'); // calabaza
  }
  place(F, 0, 0, 0);
  const farmer = skeleton(cx - 2, cz, 0, { cloth: CLOTH[0], band: '#c9b48a', act: (k, e) => { pathP(k, { x: cx - 2, z: cz - 5 }, { x: cx - 2, z: cz + 6 }, 14, e); walkP(k, e, 3, 0.3); const d = Math.max(0, Math.sin(e * 3)); k.torso.rotation.x = 0.2 + d * 0.4; k.ra.rotation.x = k.la.rotation.x = -0.6 - d * 0.6; } });
  hold(farmer.ra, vox(v => { v.fill(0, -12, 0, 0, -5, 0, '#4a3324'); v.fill(0, -14, 1, 0, -13, 1, '#3a2a1e'); }));
  const grinder = skeleton(cx + 6, cz - 2, -Math.PI / 2, { cloth: CLOTH[4], act: (k, e) => { sitP(k); const g = Math.sin(e * 2.5); k.torso.rotation.x = 0.5 + g * 0.15; k.la.rotation.x = k.ra.rotation.x = -1 - g * 0.25; } });
  hold(grinder.root, vox(v => { v.fill(-2, 0, 2, 2, 1, 5, '#3a3436'); v.fill(-2, 2, 4, 2, 2, 4, '#2b292e'); v.fill(3, 0, 3, 4, 1, 4, '#e8c04a'); }), 0, S2 / 2, 0);
  house(cx + 5, cz + 5, -0.4);
}

{

  hold(scribe.root, vox(v => { for (let x = -7; x <= 7; x++) { const y = Math.floor((x + 8) / 4) % 2; v.fill(x, y, 3, x, y, 6, (xx, yy, z) => (x + z) % 5 == 0 ? pick(['#a8321f', '#1a1210', '#3d8f87', '#c98a2a']) : '#efe6cf'); } }), 0, S2 / 2, 0);
  const appr = skeleton(cx + Math.cos(ry) * 3, cz - Math.sin(ry) * 3, ry, { cloth: CLOTH[1], act: (k, e) => { sitP(k); const g = Math.sin(e * 3); k.torso.rotation.x = 0.4 + g * 0.1; k.ra.rotation.x = k.la.rotation.x = -0.9 - g * 0.2; } });
  hold(appr.root, vox(v => ['#a8321f', '#1a1210', '#3d8f87', '#c98a2a', '#e8c04a'].forEach((c, i) => { v.fill(i * 3 - 6, 0, 3, i * 3 - 5, 1, 4, '#7a4f33'); v.put(i * 3 - 6, 2, 3, c); })), 0, S2 / 2, 0);

// -- temazcal: stone steam bath, its fire, a bather and a healer fanning steam with herbs
{
  const [cx, cz] = ISL.temazcal, ry = face(cx, cz, 0, 0), gy = ground(cx, cz), sx = Math.sin(ry), sz = Math.cos(ry);

    for (let y = 0; y <= 6; y++) for (let x = -7; x <= 7; x++) for (let z = -7; z <= 7; z++) { const d = Math.hypot(x, y * 1.2, z); if (d <= 7.5 && d > 6.3) v.put(x, y, z, (x + y) % 5 ? pick(['#6e6a66', '#5c5650', '#7a7066']) : '#c4bba6'); }
    v.fill(-1, 0, 6, 1, 2, 7, '#0d0c10');
  }, 0.4), 0, 0.2, 0);
  fire(cx + sz * 4, cz - sx * 4);
  skeleton(cx + sx * 4.5, cz + sz * 4.5, ry, { cloth: '#efe6cf', act: (k, e) => { sitP(k); k.head.rotation.x = 0.2 + Math.sin(e * 0.6) * 0.1; k.la.rotation.x = k.ra.rotation.x = -0.4; } });
  const puffs = Array.from({ length: 6 }, () => { const m = new THREE.Mesh(box, new THREE.MeshBasicMaterial({ color: 0xe8e0cc, transparent: true, depthWrite: false })); world.add(m); return m; });
  const healer = skeleton(cx + sx * 3.5 - sz * 2.5, cz + sz * 3.5 + sx * 2.5, ry + Math.PI / 2, { cloth: CLOTH[4], band: '#3d6b5a', act: (k, e) => {
    k.ra.rotation.x = -1.2 + Math.sin(e * 4) * 0.4; k.la.rotation.x = -0.3;
    puffs.forEach((m, i) => { const f = (e * 0.25 + i / 6) % 1; m.position.set(cx + Math.sin(i * 2.4) * f * 2, gy + 3 + f * 6, cz + Math.cos(i * 2.4) * f * 2); m.scale.setScalar(0.6 + f * 1.6); m.material.opacity = 0.3 * (1 - f); });
  } });
  hold(healer.ra, vox(v => { v.fill(0, -9, 0, 0, -5, 0, '#4a3324'); v.fill(-1, -12, -1, 1, -10, 1, () => pick(['#4f6b3a', '#5f7f3a', '#3d6b5a'])); }));
  tree(cx - 6, cz + 4);
}

// -- patolli: two players on a mat throwing marked beans, onlookers cheering
{

  for (const side of [0, 1]) skeleton(cx + (side ? 2.6 : -2.6), cz, side ? -Math.PI / 2 : Math.PI / 2, { cloth: CLOTH[side ? 0 : 1], act: (k, e) => {
    sitP(k); const a = Math.max(0, Math.sin(e * 1.5 + side * Math.PI));
    k.torso.rotation.x = 0.3 + a * 0.2; k.ra.rotation.x = -0.6 - a * 1.2; k.la.rotation.x = -0.5;
    if (!side) {
      beans.position.y = gy + 0.3 + Math.abs(Math.sin(e * 1.5)) * 1.2; beans.rotation.y = e * 3;
      const n = Math.floor(e * 1.5 / Math.PI); if (n != beans.n) { beans.n = n; SFX.at(beans.position, SFX.clack, 35); } // beans land
    }
  } });
  for (const sz of [-1, 1]) skeleton(cx, cz + sz * 3.6, sz > 0 ? Math.PI : 0, { cloth: pick(CLOTH), act: (k, e) => { const c = Math.max(0, Math.sin(e * 3 + sz)); k.la.rotation.z = c * 2.4; k.ra.rotation.z = -c * 2.4; } });
  tree(cx + 6, cz + 5);
}

// rising copal / fire smoke; returns a per-frame updater
function smoke(x, y, z, n, col = 0xc9c1ae) {
  const ms = Array.from({ length: n }, () => { const m = new THREE.Mesh(box, new THREE.MeshBasicMaterial({ color: col, transparent: true, depthWrite: false })); world.add(m); return m; });
  return e => ms.forEach((m, i) => { const f = (e * 0.3 + i / n) % 1; m.position.set(x + Math.sin(i * 2.4 + e * 0.5) * f, y + f * 4, z + Math.cos(i * 2.4) * f); m.scale.setScalar(0.3 + f); m.material.opacity = 0.35 * (1 - f); });
}

// -- guerreros: eagle and jaguar warriors sparring, youths drilling, a veteran watching
const spar = { n: 0 };
{
  const [cx, cz] = ISL.guerreros;
  const club = () => vox(v => { v.fill(0, -12, 0, 0, -5, 0, '#4a3324'); for (let y = -12; y <= -8; y++) { v.put(0, y, 1, '#0d0c10'); v.put(0, y, -1, '#0d0c10'); } }); // macuahuitl: obsidian edges
  const shield = c => vox(v => { for (let x = -3; x <= 3; x++) for (let z = -3; z <= 3; z++) if (x * x + z * z <= 10) v.put(x, 0, z, x * x + z * z > 6 ? '#a8742e' : c); }); // chimalli
  const helm = jag => vox(v => {
    const c = (x, y, z) => jag ? ((x + y + z) % 3 ? '#c98a2a' : '#1a1210') : '#6b4423';
    v.fill(-3, 5, -3, 3, 5, 3, c); v.fill(-3, 3, -3, 3, 4, -3, c); v.fill(-3, 3, -2, -3, 4, 2, c); v.fill(3, 3, -2, 3, 4, 2, c);
    if (jag) { v.put(-2, 6, 0, '#c98a2a'); v.put(2, 6, 0, '#c98a2a'); v.put(-1, 4, 3, '#efe6cf'); v.put(1, 4, 3, '#efe6cf'); }
    else { v.fill(-1, 5, 3, 1, 6, 5, '#e8c04a'); v.fill(-3, 6, -3, 3, 6, -1, '#efe6cf'); }
  });
  for (const side of [0, 1]) {
    const w = skeleton(cx + (side ? 1.7 : -1.7), cz, side ? -Math.PI / 2 : Math.PI / 2, { cloth: side ? '#c98a2a' : '#efe6cf', act: (k, e) => {
      const sw = Math.sin(e * 3 + side * Math.PI);
      k.ra.rotation.x = -1.6 - sw * 1.1; k.la.rotation.x = -1.4; k.torso.rotation.y = sw * 0.25;
      k.pel.position.y = 6 * S2 - 0.15; k.ll.rotation.x = 0.4; k.rl.rotation.x = -0.4;
      if (!side) { const n = Math.floor(e * 3 / Math.PI); if (n != spar.n) { spar.n = n; SFX.at(k.root.position, SFX.strike, 40); } } // clubs meet on each swing
    } });
    hold(w.head, helm(side)); hold(w.ra, club()); hold(w.la, shield(side ? '#1a1210' : '#a8321f'), 0, -5 * S2, 0);

  for (let i = 0; i < 3; i++) {
    const y = skeleton(cx - 3 + i * 3, cz + 4, Math.PI, { cloth: '#c9b48a', act: (k, e) => { const sw = Math.sin(e * 2); k.ra.rotation.x = -1.4 - sw; k.ll.rotation.x = 0.3; k.rl.rotation.x = -0.3; } });
    hold(y.ra, club());

}

// -- sacrificio: a small teocalli with the techcatl stone, a tzompantli and black-painted priests with copal
{
  const [cx, cz] = ISL.sacrificio, ry = face(cx, cz, 0, 0), gy = ground(cx, cz), sx = Math.sin(ry), sz = Math.cos(ry);
  const T2 = new V(0.5);
  for (let i = 0; i < 3; i++) T2.fill(-6 + i * 2, i * 2, -6 + i * 2, 6 - i * 2, i * 2 + 1, 6 - i * 2, (x, y) => y % 2 ? '#3e3a3c' : basalt());
  for (let y = 0; y < 6; y++) T2.fill(-1, y, 0, 1, y, 7 - y, '#57504d');
  T2.fill(0, 6, -1, 0, 7, 0, '#1d1b20'); T2.fill(1, 6, -2, 2, 6, -1, '#5b5a48'); // techcatl and cuauhxicalli
  const tg = place(T2, cx, gy + 0.25, cz); tg.rotation.y = ry;
  hold(atRoot(cx + sz * 6, cz - sx * 6, ry), vox(v => {

  }, 0.25), 0, 0.125, 0);

  for (const off of [-1.2, 1.2]) {

}

{

}

  for (const s of skels) s.act(e);
  { // ball game: the rubber ball flies between the two players, who hip-strike it
    const u = (e / 1.6) % 2, f = u < 1 ? u : 2 - u, bx = lerp(ballGame.a.x, ballGame.b.x, f), n = Math.floor(e / 1.6);
    if (n != ballGame.n) { ballGame.n = n; SFX.at(ballGame.ball.position, SFX.ball, 40); } // hip strike
    ballGame.ball.position.set(bx, ground(bx, ballGame.a.z) + 0.9 + Math.sin(f * Math.PI) * 2.6, ballGame.a.z);
    for (const { side, k } of ballGame.players) {
      const hit = Math.max(0, 1 - (side ? 1 - f : f) * 4);
      k.pel.position.y = 6 * S2 - hit * 0.35; k.torso.rotation.z = (side ? -1 : 1) * hit * 0.5;
      k.la.rotation.z = 0.5 + hit * 0.4; k.ra.rotation.z = -0.5 - hit * 0.4;
    }
  }
  for (const l of fires) l.intensity = 25 + Math.sin(e * 13 + l.position.x) * 5 + Math.sin(e * 7.3) * 4;

  for (const L of lords) {
    const ly = Math.atan2(camera.position.x - L.root.position.x, camera.position.z - L.root.position.z) - L.root.rotation.y;
    L.head.rotation.y = Math.max(-0.7, Math.min(0.7, ly)) * q * 0.8 + Math.sin(e * 0.4 + L.root.position.x) * 0.06;
    L.root.scale.y = 1 + Math.sin(e * 1.1 + L.root.position.x) * 0.006;
    if (L.isHim) {
      L.arms[1].rotation.x = -ss(4, 9, t) * 0.9 + ss(14, 18, t) * 0.9; // slow welcoming gesture
      L.owl.rotation.y = Math.sin(e * 0.6) * 1.2;
      L.jaw.rotation.x = 0.1;
    } else {
      L.jaw.rotation.x = 0.25 + (0.5 + 0.5 * Math.sin(e * 0.5)) * 0.45;
    }
  }

  // wind
  for (const s of sway) { s.rotation.z = Math.sin(e * 0.7 + s.position.x) * 0.025; s.rotation.x = Math.sin(e * 0.5 + s.position.z) * 0.02; }
  for (const b of banners) {
    const pos = b.m.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      bannerTmp.fromArray(b.base, i * 3);
      pos.setZ(i, Math.sin(e * 2.2 + bannerTmp.x * 2.5 + bannerTmp.y * 0.8 + b.ph) * 0.35 * (bannerTmp.x / 1.6));
    }
    pos.needsUpdate = true; b.m.geometry.computeVertexNormals();
  }

  // dark water over the edge
  for (let i = 0; i < NF; i++) {
    const [jx, jz, off] = fj[i], f = (off + e * 0.35) % 1;
    o3.position.set(fallO.x + fallDir.x * f * 4 + jx * 1.4, fallO.y - f * f * 60, fallO.z + fallDir.z * f * 4 + jz * 1.4);
    o3.scale.setScalar(0.6 * (1 - f * 0.5)); o3.rotation.set(0, 0, 0); o3.updateMatrix();
    fallMesh.setMatrixAt(i, o3.matrix);
  }
  fallMesh.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < NS; i++) {
    const z = -20 + ((i * 7.3 + e * 2.5) % (ez + 21));
    o3.position.set(rx(z) + ((i * 0.37) % 1 - 0.5) * 2, 2.52, z); o3.scale.set(0.12, 0.02, 1.2); o3.updateMatrix();
    streaks.setMatrixAt(i, o3.matrix);
  }
  streaks.instanceMatrix.needsUpdate = true;

  // pale motes drifting around the temple and below the island
  const mp = motes.geometry.attributes.position;
  moteSeed.forEach(([r, a0, y0, sp], i) => {
    const y = ((y0 + e * sp * 1.5) % 90) - 50, ang = a0 + e * 0.04 * sp;
    mp.setXYZ(i, Math.cos(ang) * r, y, Math.sin(ang) * r - (y > 0 ? 8 : 0));
  });
  mp.needsUpdate = true;
  const dp = dust.geometry.attributes.position;
  dustSeed.forEach(([x0, z0, y0, o], i) => { const x = ((x0 + e * 7) % 80) - 40; dp.setXYZ(i, x, 3.8 + y0 * 0.3 + Math.sin(e * 3 + o) * 0.4, z0 + Math.sin(x * 0.2 + o) * 2); });
  dp.needsUpdate = true;
  dust.material.opacity = 0.15 + 0.45 * Math.max(0, Math.sin(e * 0.45));

  for (const s of stones) { s.g.position.y = s.y + Math.sin(e * 0.6 + s.ph) * 0.8; s.g.rotation.y = e * 0.05 + s.ph; }
  for (const c of clouds) { c.a += c.s * 0.016; c.m.position.x = Math.cos(c.a) * c.r; c.m.position.z = Math.sin(c.a) * c.r; }
  for (const f of flyers) {
    const ang = f.ph + e * f.sp;
    f.g.position.set(Math.cos(ang) * f.r, f.y + Math.sin(e * 0.7 + f.ph) * 2, Math.sin(ang) * f.r);
    f.g.rotation.y = -ang + (f.sp > 0 ? 0 : Math.PI);
    const w = Math.sin(e * f.flap + f.ph) * (f.flap > 5 ? 0.8 : 0.25);
    f.wings[0].rotation.z = w; f.wings[1].rotation.z = -w;
  }

  if (live()) ambience(t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
